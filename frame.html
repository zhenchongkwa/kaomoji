<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กรอบข้อความ — คลังคาโอโมจิ</title>
  <meta name="description" content="สร้างกรอบข้อความ AA น่ารัก ล้อมข้อความด้วยหัวใจ ดาว หรือกรอบฟูฟ่อง พร้อมสัตว์น่ารักด้านบน ปรับความกว้างให้ไม่เพี้ยนบนมือถือ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+JP:wght@400&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=19">
  <script src="js/intro.js?v=19"></script>
  <script>try { var t = localStorage.getItem("kao.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-page="frame" data-title-key="navFrame">
  <header id="siteHeader" class="header"></header>

  <main class="main tool">
    <div class="page-head" data-tone="0">
      <div class="page-icon" aria-hidden="true">┏♡┓</div>
      <h1 class="page-title" data-i18n="frameTitle"></h1>
      <p class="lead" data-i18n="frameLead"></p>
      <p class="privacy" data-i18n="privacy"></p>
    </div>

    <section class="panel" data-tone="3">
      <h2 class="step"><span class="step-num">1</span><span data-i18n="frameStep1"></span></h2>
      <textarea id="input" class="field" rows="3" data-i18n-ph="frameInput"></textarea>
    </section>

    <section class="panel" data-tone="1">
      <h2 class="step"><span class="step-num">2</span><span data-i18n="frameStep2"></span></h2>
      <nav class="chips" id="frameChips"></nav>
      <h2 class="step step-gap"><span class="step-num">3</span><span data-i18n="frameStep3"></span></h2>
      <nav class="chips" id="animalChips"></nav>
    </section>

    <section class="panel" data-tone="4">
      <h2 class="step"><span class="step-num">4</span><span data-i18n="frameStep4"></span></h2>
      <div class="range-row">
        <span data-i18n="frameNarrow"></span>
        <input type="range" id="width" min="5" max="14" step="1" value="9">
        <span data-i18n="frameWide"></span>
      </div>
      <p class="range-val" id="widthVal"></p>
      <p class="note" data-i18n="frameWidthNote"></p>
      <h2 class="step step-gap"><span class="step-num">5</span><span data-i18n="frameStep5"></span></h2>
      <nav class="chips" id="alignChips">
        <button type="button" class="chip active" data-align="center" data-i18n="alignCenter"></button>
        <button type="button" class="chip" data-align="left" data-i18n="alignLeft"></button>
      </nav>
    </section>

    <section class="panel" data-tone="2">
      <h2 class="section-title center" data-i18n="framePreview"></h2>
      <div class="post" id="preview">
        <div class="post-avatar" aria-hidden="true">˘ᵕ˘</div>
        <div class="post-main">
          <div class="post-head"><b data-i18n="you"></b> <span>@you · <span data-i18n="now"></span></span></div>
          <div class="post-body" id="out"></div>
        </div>
      </div>
      <p class="fit" id="fit"></p>
      <div class="btn-row">
        <button type="button" class="btn" id="copyBtn" data-i18n="copy"></button>
        <button type="button" class="btn btn-outline" id="clearBtn" data-i18n="clear"></button>
      </div>
      <p class="note center" data-i18n="frameShift"></p>
    </section>
  </main>

  <footer id="siteFooter" class="footer"></footer>

  <script src="js/i18n.js?v=19"></script>
  <script src="js/sound.js?v=19"></script>
  <script src="js/common.js?v=19"></script>
  <script src="js/fonts.js?v=19"></script>
  <script src="js/frame.js?v=19"></script>
</body>
</html>
