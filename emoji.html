<body data-page="emoji" data-title-key="navEmoji">
  <header id="siteHeader" class="header"></header>

  <main class="main tool">
    <div class="page-head" data-tone="0">
      <div class="page-icon" aria-hidden="true">🩷</div>
      <h1 class="page-title" data-i18n="emojiTitle"></h1>

      <div class="btn-row">
        <button type="button" class="btn" id="copyBtn" data-i18n="copy"></button>
      </div>
    </section>

    <section class="panel" data-tone="3">
      <h2 class="section-title" data-i18n="emojiMore"></h2>
      <div class="pills" id="alts"></div>
    </section>

        <li data-i18n="emojiHow2"></li>
        <li data-i18n="emojiHow3"></li>
      </ol>
